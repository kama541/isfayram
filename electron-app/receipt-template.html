<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Consolas', 'Lucida Console', 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      background: #fff;
      width: 64mm;
      max-width: 64mm;
      padding: 0;
      margin: 0 auto;
      overflow: visible;
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 4px;
    }
    .logo-wrap img {
      width: 80px;
      height: 70px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .restaurant-name {
      text-align: center;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .restaurant-sub {
      text-align: center;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .divider-solid { border-top: 2px solid #000; margin: 5px 0; }
    .divider-dash  { border-top: 1px dashed #000; margin: 5px 0; }
    .info { text-align: center; margin-bottom: 4px; line-height: 1.6; }
    .info .table-num { font-size: 26px; font-weight: 900; margin: 4px 0; }
    .info .label     { font-size: 14px; font-weight: normal; }
    .info .waiter    { font-size: 16px; margin-bottom: 4px; }
    .info .time      { font-size: 14px; font-weight: normal; }
    .items { margin: 10px 0; }
    .item { text-align: center; margin-bottom: 12px; }
    .item .name { display: block; font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; }
    .item .qty  { display: block; font-size: 24px; font-weight: 900; }
    .footer       { text-align: center; font-size: 12px; font-weight: bold; margin-top: 10px; letter-spacing: 1px; }
    .footer-thanks { text-align: center; font-size: 14px; margin-top: 4px; font-weight: 900; }
    @media print { 
      @page { size: 80mm auto; margin: 0; }
      html, body { width: 64mm; overflow: visible; } 
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img id="logo-img" src="" alt="Logo" style="display:none; width: 130px; height: auto; margin: 0 auto 4px;" />
  </div>
  <div id="text-brand-header" style="text-align: center;">
    <div class="restaurant-name" style="font-size: 18px; font-weight: 900; letter-spacing: 1px; margin-bottom: 5px;">ISFAYRAM KAFE</div>
  </div>
  <div class="divider-solid"></div>
  <div class="info">
    <span class="label">XONA / STOL</span>
    <p class="table-num"><span id="table-number"></span></p>
    <p class="waiter">Ofitsiant: <span id="waiter-name"></span></p>
    <p class="time" id="time"></p>
  </div>
  <div class="divider-dash"></div>
  <div style="text-align:center; font-size:10px; margin-bottom:4px; letter-spacing:1px;">── BUYURTMA ──</div>
  <div class="items" id="items-list"></div>
  <div class="divider-solid"></div>
  <div class="info" style="margin-top:4px;">
    <p style="font-size:11px;">Oshxona: <b id="station-name"></b></p>
  </div>
  <div class="divider-dash"></div>
  <div class="footer">★ TEZROQ TAYYORLAB BERING ★</div>
  <div class="footer-thanks">RAHMAT!</div>

  <script>
    const data = window.__RECEIPT_DATA__;
    if (data) {
      if (data.logoBase64) {
        const img = document.getElementById('logo-img');
        img.src = data.logoBase64;
        img.style.display = 'block';
        const txtHeader = document.getElementById('text-brand-header');
        if (txtHeader) txtHeader.style.display = 'none';
      }
      const rawStation = data.stationName || '';
      let cleanStation = rawStation.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
      cleanStation = cleanStation.replace(/\b[Rr]oom\b/gi, '').replace(/\b[Xx]ona(si)?\b/gi, '').trim();
      if (/shashlik|mangal|kabob/i.test(cleanStation)) cleanStation = 'SHASHLIK';
      else if (/fish|baliq/i.test(cleanStation)) cleanStation = 'BALIQ';
      else if (/tandir|somsa/i.test(cleanStation)) cleanStation = 'TANDIR';
      else if (/bar|ichimlik/i.test(cleanStation)) cleanStation = 'BAR';
      document.getElementById('station-name').textContent = cleanStation.toUpperCase() || 'OSHXONA';
      document.getElementById('table-number').textContent = data.tableNumber || '';
      document.getElementById('waiter-name').textContent  = data.waiterName  || "Noma'lum";
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('time').textContent =
        pad(now.getDate()) + '.' + pad(now.getMonth()+1) + '.' + now.getFullYear() + '  ' +
        pad(now.getHours()) + ':' + pad(now.getMinutes());
      const list = document.getElementById('items-list');
      (data.items || []).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = '<span class="name">' + item.name + '</span><span class="qty">' + item.quantity + ' ta</span>';
        list.appendChild(div);
      });
    }
    window.onload = () => setTimeout(() => window.print(), 300);

</script>
</body>
</html>
